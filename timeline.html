<!DOCTYPE html>
<html lang="en">

<head>
    <link href="assets/icons/AC_OG.webp" rel="icon" type="image/webp">
    <meta charset="UTF-8">
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Google Fonts: Orbitron (display) + Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline — Assassin's Creed Tribute</title>

    <meta name="description"
        content="An interactive timeline of every Assassin's Creed game, in story order or release order, from Ancient Greece to Feudal Japan.">

    <!-- Open Graph -->
    <meta property="og:title" content="Timeline — Assassin's Creed Tribute">
    <meta property="og:description"
        content="An interactive timeline of every Assassin's Creed game, in story order or release order, from Ancient Greece to Feudal Japan.">
    <meta property="og:image" content="https://assassins-creed-tribute.netlify.app/assets/social/OG.png">
    <meta property="og:url" content="https://assassins-creed-tribute.netlify.app/timeline.html">
    <meta property="og:type" content="website">
    <link rel="preload" href="assets/fonts/Assassin.ttf" as="font" type="font/ttf" crossorigin="anonymous">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Site Shared Styles -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">

    <!-- Discover Styles -->
    <link rel="stylesheet" href="css/pages/discover.css">

    <!-- Particles.js -->
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script src="js/components.js"></script>
</head>

<body>
    <noscript>
        <p style="padding:6rem 2rem;color:#fff;text-align:center;">JavaScript is required for this page. <a href="index.html" style="color:#00d2ff;">Return to base</a></p>
    </noscript>
    <div id="particles-js"></div>
    <loading-screen></loading-screen>
    <site-header></site-header>

    <main class="dx-main">
        <p class="dx-eyebrow"><i class="bi bi-clock-history"></i> Animus Archives</p>
        <h1 class="dx-title">The Timeline</h1>
        <p class="dx-lead">Walk through two thousand years of hidden history. Switch between the order the stories happen in and the order the games came out, and open any entry for its dossier.</p>

        <div class="tl-toolbar">
            <div class="dx-chips" id="tl-eras" role="group" aria-label="Filter by era"></div>
            <div class="dx-chips" id="tl-sort" role="group" aria-label="Sort order">
                <button class="dx-chip" type="button" data-sort="story" aria-pressed="true">Story order</button>
                <button class="dx-chip" type="button" data-sort="release" aria-pressed="false">Release order</button>
            </div>
        </div>
        <p class="dx-status" id="tl-status" role="status" aria-live="polite"></p>
        <ol class="tl" id="tl"></ol>
    </main>

    <site-footer></site-footer>

    <button id="scroll-top" aria-label="Scroll to top">
        <i class="bi bi-arrow-up"></i>
    </button>

    <script src="js/script.js"></script>
    <script src="js/pages/timeline.js"></script>
</body>

</html>
